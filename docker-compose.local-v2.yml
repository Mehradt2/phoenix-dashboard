name: kuleposhti-local-v2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuleposhti}
      POSTGRES_USER: ${POSTGRES_USER:-kuleposhti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - kp_pg_v2:/var/lib/postgresql/data
    networks: [kp_internal]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-kuleposhti} -d ${POSTGRES_DB:-kuleposhti}"]
      interval: 5s
      timeout: 3s
      retries: 20

  text-brain:
    build: ./services/text-brain
    restart: unless-stopped
    networks: [kp_internal]
    expose: ["8090"]
    environment:
      KP_LOCAL_ONLY: "true"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      text-brain: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kuleposhti}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kuleposhti}
      TEXT_BRAIN_URL: http://text-brain:8090
      OGANSON_BASE_URL: ${OGANSON_BASE_URL:-http://host.docker.internal:9080}
      KP_LOCAL_ONLY: "true"
    networks: [kp_internal]
    expose: ["8787"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${KP_HTTP_PORT:-8080}:80"
    networks: [kp_internal]

networks:
  kp_internal:
    driver: bridge
volumes:
  kp_pg_v2:
