name: Verify HomeLabQC v1.2.3 Public Update Channel

on:
  push:
    paths:
      - '.github/workflows/homelabqc-verify-v1.2.3-channel.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact latest manifest URL used by installed application
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/Mehradt2/phoenix-dashboard/releases/latest/download/latest.json' -o latest.json
          cat latest.json
      - name: Verify manifest fields and download advertised installer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('latest.json').read_text(encoding='utf-8-sig'))
          assert m['version'] == '1.2.3', m
          assert m['installer_name'] == 'HomeLAB-ResusltsQC-Setup-v1.2.3.exe', m
          assert m['installer_url'] == 'https://github.com/Mehradt2/phoenix-dashboard/releases/download/v1.2.3/HomeLAB-ResusltsQC-Setup-v1.2.3.exe', m
          assert m['sha256'].lower() == '6f035b9c3a8980494de0a0f104b3698afcf05faea25d0112fdc04b7be82e6b10', m
          assert int(m['size']) == 121464997, m
          Path('installer_url.txt').write_text(m['installer_url'], encoding='utf-8')
          PY
          URL="$(cat installer_url.txt)"
          curl -fL --retry 3 --connect-timeout 20 "$URL" -o HomeLAB-ResusltsQC-Setup-v1.2.3.exe
      - name: Verify public bytes exactly equal private tested artifact
        run: |
          echo '6f035b9c3a8980494de0a0f104b3698afcf05faea25d0112fdc04b7be82e6b10  HomeLAB-ResusltsQC-Setup-v1.2.3.exe' | sha256sum -c -
          test "$(stat -c%s HomeLAB-ResusltsQC-Setup-v1.2.3.exe)" = '121464997'
          echo 'Public latest manifest and advertised installer verified end to end.'
