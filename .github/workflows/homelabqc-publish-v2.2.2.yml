name: Publish HomeLAB QC v2.2.2 exact tested binaries

on:
  push:
    paths:
      - '.github/workflows/homelabqc-publish-v2.2.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: f920a31acb17b08b8321bb705a88719ad23e105bb6337b8cf05eafb1d4db6b20
      EXPECTED_SIZE: '121690608'
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-b430-8246-b337-1092d8cef730/raw?se=2026-08-08T13%3A48%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=302c545e-45aa-5fcf-8ed6-64bb76f7caba&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T04%3A49%3A39Z&ske=2026-08-09T04%3A49%3A39Z&sks=b&skv=2026-02-06&sig=GaUclSN3dIBHz/Hx5oCCuFZqKjImCIqb7Hqw%2B6mHSyM%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download exact private stable artifact
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o stable.zip
          unzip -q stable.zip -d stable
          find stable -maxdepth 2 -type f -print
      - name: Verify exact stable installer identity and manifest
        run: |
          INSTALLER=$(find stable -type f -name 'HomeLAB-ResusltsQC-Setup-v2.2.2.exe' -print -quit)
          EXE=$(find stable -type f -name 'HomeLAB-ResusltsQC.exe' -print -quit)
          SUMS=$(find stable -type f -name 'SHA256SUMS.txt' -print -quit)
          MANIFEST=$(find stable -type f -name 'latest.json' -print -quit)
          NOTICE=$(find stable -type f -name 'THIRD_PARTY_MEDICAL_AI_NOTICE.txt' -print -quit)
          test -n "$INSTALLER" && test -n "$EXE" && test -n "$SUMS" && test -n "$MANIFEST" && test -n "$NOTICE"
          SHA=$(sha256sum "$INSTALLER" | awk '{print $1}')
          SIZE=$(stat -c%s "$INSTALLER")
          test "$SHA" = "$EXPECTED_SHA"
          test "$SIZE" = "$EXPECTED_SIZE"
          python - "$MANIFEST" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8-sig'))
          assert d['version']=='2.2.2',d
          assert d['installer_name']=='HomeLAB-ResusltsQC-Setup-v2.2.2.exe',d
          assert d['installer_url']=='https://github.com/Mehradt2/phoenix-dashboard/releases/download/v2.2.2/HomeLAB-ResusltsQC-Setup-v2.2.2.exe',d
          assert int(d['size'])==121690608,d
          assert d['sha256']=='f920a31acb17b08b8321bb705a88719ad23e105bb6337b8cf05eafb1d4db6b20',d
          assert d['network_policy']=='manual-one-operation-consent',d
          assert d['model_download']=='ollama-native-resume-with-persistent-ui-state',d
          PY
          mkdir out
          cp "$INSTALLER" out/HomeLAB-ResusltsQC-Setup-v2.2.2.exe
          cp "$EXE" out/HomeLAB-ResusltsQC.exe
          cp "$SUMS" out/SHA256SUMS.txt
          cp "$MANIFEST" out/latest.json
          cp "$NOTICE" out/THIRD_PARTY_MEDICAL_AI_NOTICE.txt
      - name: Publish public binary/update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.2.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v2.2.2 out/HomeLAB-ResusltsQC-Setup-v2.2.2.exe out/HomeLAB-ResusltsQC.exe out/SHA256SUMS.txt out/latest.json out/THIRD_PARTY_MEDICAL_AI_NOTICE.txt --title 'HomeLAB Results QC v2.2.2' --notes 'Exact tested binary channel for HomeLAB Results QC v2.2.2. Adds restart-safe resumable MedGemma downloads: interrupted Ollama partials are preserved and only resumed after explicit operator action. Includes manifest-first updater compatibility and preserves v2.2.1 identity/layout safeguards.' --latest
