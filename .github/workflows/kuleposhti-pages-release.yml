name: Publish KulePoshti Operational Web to Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kuleposhti-pages-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuleposhti-operational-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational source
        uses: actions/checkout@v4
        with:
          ref: kuleposhti-operational-web-v1
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, validate and build
        working-directory: source
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/index.html
          test -d dist/assets

      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish

      - name: Replace published site atomically
        shell: bash
        run: |
          cd publish
          rm -rf assets index.html 404.html
          cp -a ../source/dist/index.html ./index.html
          cp -a ../source/dist/assets ./assets
          cp ./index.html ./404.html
          touch .nojekyll
          git config user.name "kuleposhti-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html 404.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "NO_SITE_DIFF"
            exit 0
          fi
          git commit -m "Publish KulePoshti operational web from \${GITHUB_SHA}"
          git push origin HEAD:main

      - name: Verify artifact contract
        shell: bash
        run: |
          grep -q "/phoenix-dashboard/assets/" publish/index.html
          test -s publish/index.html
          test -n "$(find publish/assets -type f -name '*.js' -print -quit)"
          test -n "$(find publish/assets -type f -name '*.css' -print -quit)"
          echo "PUBLISH_CONTRACT_PASS"
