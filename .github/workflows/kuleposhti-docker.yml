name: KulePoshti Team Docker

on:
  push:
    branches: [kuleposhti-operational-web-v1, kuleposhti-local-intelligence-v2]
    paths:
      - 'src/**'
      - 'server/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'ops/**'
      - 'package.json'
      - 'index.html'
      - 'public/**'
      - '.github/workflows/kuleposhti-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend checks
        run: |
          npm install
          npm run check
          npm test
          npm run build
      - name: API checks
        working-directory: server
        run: |
          npm install
          npm test
          node --check src/index.mjs
          node --check src/migrate.mjs
          node --check src/intelligenceApi.mjs
          node --check src/oganson.mjs
      - name: Compose config
        env:
          DOMAIN: localhost
          POSTGRES_PASSWORD: ci-postgres-password-2026
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BOOTSTRAP_ADMIN_EMAIL: qc-admin@example.org
          BOOTSTRAP_ADMIN_PASSWORD: CI-Strong-Passphrase-2026!
          OGANSON_SHARED_TOKEN: ci-oganson-token-2026
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml config >/tmp/kp-compose.yml

  integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOMAIN: localhost
      POSTGRES_DB: kuleposhti
      POSTGRES_USER: kuleposhti
      POSTGRES_PASSWORD: ci-postgres-password-2026
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BOOTSTRAP_ADMIN_EMAIL: qc-admin@example.org
      BOOTSTRAP_ADMIN_PASSWORD: CI-Strong-Passphrase-2026!
      KP_RELEASE: ci-${{ github.sha }}
      OGANSON_SHARED_TOKEN: ci-oganson-token-2026
      OGANSON_BASE_URL: http://host.docker.internal:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Build and start team stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml build api web migrate
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d db
          docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm migrate
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d api web
      - name: Wait for runtime
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/healthz >/dev/null && curl -fsS http://localhost:8088/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.local.yml ps
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs --tail=200
          exit 1
      - name: Auth and RBAC smoke
        run: |
          curl -fsS -c /tmp/kp.cookies -H 'Content-Type: application/json'             -d '{"email":"qc-admin@example.org","password":"CI-Strong-Passphrase-2026!"}'             http://localhost:8088/api/auth/login | grep -q '"role":"admin"'
          curl -fsS -b /tmp/kp.cookies http://localhost:8088/api/auth/me | grep -q 'qc-admin@example.org'
          curl -fsS -b /tmp/kp.cookies http://localhost:8088/api/cases | grep -q '"cases"'
          curl -fsS -b /tmp/kp.cookies http://localhost:8088/api/audit | grep -q '"audit"'
      - name: Local Persian intelligence and Oganson ingest smoke
        run: |
          curl -fsS -b /tmp/kp.cookies -H 'Content-Type: application/json'             -d '{"domain":"voc","transcript":"خیلی ناراضی هستم، جواب آزمایش خیلی دیر شد و پشتیبانی پاسخ نداد."}'             http://localhost:8088/api/v2/intelligence/analyze | grep -q '"sentiment":"negative"'
          curl -fsS -H 'Content-Type: application/json' -H 'x-oganson-token: ci-oganson-token-2026'             -d '{"external_id":"ci-oganson-1","domain":"sampler","subject":{"external_id":"s-ci","name":"نمونه‌گیر CI"},"transcript":"سلام وقت بخیر من نمونه گیر روبرا هستم. فردا ساعت 8 تا 9 خدمت می رسم. آدرس خیابان آزادی کوچه ده پلاک 12 را تایید کنید. برای آزمایش ناشتا باشید و آب ساده مجاز است. سوالی دارید؟ ممنون.","occurred_at":"2026-10-07T10:00:00+03:30","confidence":0.93}'             http://localhost:8088/api/v2/integrations/oganson/ingest | grep -q '"duplicate":false'
          curl -fsS -b /tmp/kp.cookies 'http://localhost:8088/api/v2/interactions?domain=sampler&fromJalali=1405-07-15&toJalali=1405-07-15' | grep -q 'نمونه‌گیر CI'
          curl -fsS -b /tmp/kp.cookies 'http://localhost:8088/api/v2/profiles?domain=sampler' | grep -q 'نمونه‌گیر CI'
          curl -fsS -b /tmp/kp.cookies 'http://localhost:8088/api/v2/export.csv?domain=sampler&from=2026-10-07&to=2026-10-07' | grep -q 'sampler'
      - name: Runtime config is Team Mode
        run: curl -fsS http://localhost:8088/runtime-config.js | grep -q 'mode:"team"'
      - name: Team browser E2E
        env:
          KP_TEAM_URL: http://localhost:8088
          KP_TEAM_EMAIL: qc-admin@example.org
          KP_TEAM_PASSWORD: CI-Strong-Passphrase-2026!
        run: node scripts/team-browser-smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs --tail=250
      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  publish:
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {name: web, file: docker/web/Dockerfile}
          - {name: api, file: docker/api/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.file }}
          push: true
          tags: |
            ghcr.io/mehradt2/kuleposhti-${{ matrix.target.name }}:team-latest
            ghcr.io/mehradt2/kuleposhti-${{ matrix.target.name }}:${{ github.sha }}
