name: Verify HomeLabQC v1.4.0 Public Update Channel

on:
  push:
    paths:
      - '.github/workflows/homelabqc-verify-v1.4.0-channel.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact latest manifest URL used by installed application
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/Mehradt2/phoenix-dashboard/releases/latest/download/latest.json' -o latest.json
      - name: Validate manifest and download advertised installer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('latest.json').read_text(encoding='utf-8-sig'))
          assert m['version']=='1.4.0',m
          assert m['installer_name']=='HomeLAB-ResusltsQC-Setup-v1.4.0.exe',m
          assert m['installer_url']=='https://github.com/Mehradt2/phoenix-dashboard/releases/download/v1.4.0/HomeLAB-ResusltsQC-Setup-v1.4.0.exe',m
          assert m['sha256'].lower()=='1005ee9de89bfe63a312de97927a6d3b9e629bc5a6b6985a7da3515734432379',m
          assert int(m['size'])==121542510,m
          Path('installer-url.txt').write_text(m['installer_url'],encoding='utf-8')
          PY
          URL="$(cat installer-url.txt)"
          curl -fL --retry 3 --connect-timeout 20 "$URL" -o HomeLAB-ResusltsQC-Setup-v1.4.0.exe
      - name: Verify public bytes exactly equal final private tested artifact
        run: |
          echo '1005ee9de89bfe63a312de97927a6d3b9e629bc5a6b6985a7da3515734432379  HomeLAB-ResusltsQC-Setup-v1.4.0.exe' | sha256sum -c -
          test "$(stat -c%s HomeLAB-ResusltsQC-Setup-v1.4.0.exe)" = '121542510'
          echo 'Public v1.4 latest manifest and advertised installer verified end to end.'
