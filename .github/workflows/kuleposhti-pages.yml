name: KulePoshti Operational Web

on:
  push:
    branches: [kuleposhti-operational-web-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuleposhti-operational-release
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational source
        uses: actions/checkout@v4
        with:
          ref: kuleposhti-operational-web-v1
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, check and build
        working-directory: source
        run: |
          npm install
          npm run check
          npm test
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"

      - name: Package source + docs + Docker recovery bundle
        working-directory: source
        shell: bash
        run: |
          zip -qr "../KulePoshti_QC_Online_Source_${GITHUB_SHA}.zip" . \
            -x "node_modules/*" ".git/*" "dist/*"
          test -s "../KulePoshti_QC_Online_Source_${GITHUB_SHA}.zip"

      - name: Upload immutable recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: kuleposhti-qc-online-source-${{ github.sha }}
          path: KulePoshti_QC_Online_Source_${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Install Chromium for runtime smoke
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Create deterministic Persian WAV fixtures
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -v fa -s 125 -w /tmp/kp-sampler-fa.wav "سلام وقت بخیر من نمونه گیر روبرا هستم. برای نمونه گیری فردا ساعت هشت تا نه تماس گرفتم. لطفا آدرس و زمان را تایید کنید. برای آزمایش ناشتا باشید و آب ساده مجاز است. قبل از رسیدن دوباره تماس می گیرم. ممنون."
          espeak-ng -v fa -s 125 -w /tmp/kp-physician-fa.wav "سلام وقت بخیر من پزشک دکترساینا هستم. لطفا نام و مشخصات خودتان را تایید کنید. علت مراجعه چیست و از چه زمانی شروع شده است. سابقه بیماری و داروهای مصرفی را بفرمایید. برای آزمایش لازم است ناشتا باشید و نتیجه را پیگیری کنید. ممنون."
          test -s /tmp/kp-sampler-fa.wav
          test -s /tmp/kp-physician-fa.wav

      - name: Local browser runtime smoke
        working-directory: source
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kp-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/phoenix-dashboard/ >/dev/null; then break; fi
            sleep 1
          done
          KP_ASR_SMOKE=1 \
          KP_ASR_FIXTURE_SAMPLER=/tmp/kp-sampler-fa.wav \
          KP_ASR_FIXTURE_PHYSICIAN=/tmp/kp-physician-fa.wav \
          KP_SMOKE_URL=http://127.0.0.1:4173/phoenix-dashboard/ \
          npm run smoke:browser

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish

      - name: Publish immutable built artifact to main
        shell: bash
        run: |
          cd publish
          rm -rf assets index.html 404.html runtime-config.js
          rm -f VERIFIED.txt
          cp -a ../source/dist/index.html ./index.html
          cp -a ../source/dist/runtime-config.js ./runtime-config.js
          cp -a ../source/dist/assets ./assets
          cp ./index.html ./404.html
          touch .nojekyll
          printf '%s\n' \
            "source_branch=kuleposhti-operational-web-v1" \
            "source_sha=$GITHUB_SHA" \
            "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "runtime=browser-local" \
            "audio_cloud_transport=false" \
            "paid_asr_api=false" > RELEASE.txt
          git config user.name "kuleposhti-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO_SITE_DIFF"
            exit 0
          fi
          git commit -m "Release operational web $GITHUB_SHA"
          git push origin HEAD:main

      - name: Verify public GitHub Pages release and runtime
        working-directory: source
        shell: bash
        run: |
          EXPECTED="$GITHUB_SHA"
          RELEASE_URL="https://mehradt2.github.io/phoenix-dashboard/RELEASE.txt"
          PAGE_URL="https://mehradt2.github.io/phoenix-dashboard/?release=$GITHUB_SHA"
          MATCHED=0
          for i in $(seq 1 48); do
            BODY="$(curl -fsS "$RELEASE_URL?ts=$(date +%s)" || true)"
            if printf '%s' "$BODY" | grep -q "source_sha=$EXPECTED"; then
              MATCHED=1
              break
            fi
            sleep 5
          done
          test "$MATCHED" -eq 1
          KP_ASR_SMOKE=1 \
          KP_ASR_FIXTURE_SAMPLER=/tmp/kp-sampler-fa.wav \
          KP_ASR_FIXTURE_PHYSICIAN=/tmp/kp-physician-fa.wav \
          KP_SMOKE_URL="$PAGE_URL" \
          npm run smoke:browser


      - name: Mark release verified after public real-audio E2E
        shell: bash
        run: |
          cd publish
          printf '%s\n' \
            "source_sha=$GITHUB_SHA" \
            "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "public_runtime=true" \
            "real_audio_whisper_e2e=true" \
            "sampler_qc_e2e=true" \
            "physician_qc_e2e=true" \
            "manual_recovery_e2e=true" > VERIFIED.txt
          git add VERIFIED.txt
          git commit -m "Verify operational web $GITHUB_SHA"
          git push origin HEAD:main
