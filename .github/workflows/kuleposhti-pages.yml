name: KulePoshti Operational Web

on:
  push:
    branches: [kuleposhti-operational-web-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuleposhti-operational-release
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational source
        uses: actions/checkout@v4
        with:
          ref: kuleposhti-operational-web-v1
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, check and build
        working-directory: source
        run: |
          npm install
          npm run check
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish

      - name: Publish immutable built artifact to main
        shell: bash
        run: |
          cd publish
          rm -rf assets index.html 404.html
          cp -a ../source/dist/index.html ./index.html
          cp -a ../source/dist/assets ./assets
          cp ./index.html ./404.html
          touch .nojekyll
          printf '%s\n' \
            "source_branch=kuleposhti-operational-web-v1" \
            "source_sha=$GITHUB_SHA" \
            "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "runtime=browser-local" \
            "audio_cloud_transport=false" \
            "paid_asr_api=false" > RELEASE.txt
          git config user.name "kuleposhti-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html 404.html assets .nojekyll RELEASE.txt
          if git diff --cached --quiet; then
            echo "NO_SITE_DIFF"
            exit 0
          fi
          git commit -m "Release operational web $GITHUB_SHA"
          git push origin HEAD:main
