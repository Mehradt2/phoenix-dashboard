name: Fix HomeLAB QC v2.2.1 update manifest compatibility

on:
  push:
    paths:
      - '.github/workflows/homelabqc-fix-v221-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish backward-compatible latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > latest.json <<'JSON'
          {
            "schema": 1,
            "version": "2.2.1",
            "latest_version": "2.2.1",
            "filename": "HomeLAB-ResusltsQC-Setup-v2.2.1.exe",
            "installer_name": "HomeLAB-ResusltsQC-Setup-v2.2.1.exe",
            "installer_url": "https://github.com/Mehradt2/phoenix-dashboard/releases/download/v2.2.1/HomeLAB-ResusltsQC-Setup-v2.2.1.exe",
            "release_url": "https://github.com/Mehradt2/phoenix-dashboard/releases/tag/v2.2.1",
            "release_name": "HomeLAB Results QC v2.2.1",
            "size": 121678780,
            "sha256": "b1ba0ebdc409977a875830ff20f0adb5cc6885ca5039762387c7f1a8111bb022",
            "source_commit": "442426dfb18ec9aeb1b9ad3e143f8c064e1caf48",
            "network_policy": "manual-one-operation-consent",
            "release_channel": "stable",
            "identity_layout": "dual-ocr-role-consensus"
          }
          JSON
          python - <<'PY'
          import json
          d=json.load(open('latest.json',encoding='utf-8'))
          assert d['installer_name']=='HomeLAB-ResusltsQC-Setup-v2.2.1.exe'
          assert d['installer_url'].startswith('https://github.com/')
          assert d['size']==121678780
          assert d['sha256']=='b1ba0ebdc409977a875830ff20f0adb5cc6885ca5039762387c7f1a8111bb022'
          PY
          gh release upload v2.2.1 latest.json --clobber
