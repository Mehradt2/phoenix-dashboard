name: Publish HomeLabQC v1.3.0 Exact Tested Binary

on:
  push:
    paths:
      - '.github/workflows/homelabqc-publish-v1.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact private tested workflow artifact
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprukwest.oaiusercontent.com/files/00000000-f750-8243-8669-9b2bceccef64/raw?se=2026-08-07T22%3A12%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=b2699db3-3c65-5a83-aaec-93d6dbde1f4f&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T07%3A49%3A05Z&ske=2026-08-08T07%3A49%3A05Z&sks=b&skv=2026-02-06&sig=lIGKYqaOdNQS6ZWyFftR6wKwngVRhaQBZRcMUTXayP4%3D' -o homelab-artifact.zip
          mkdir -p dist
          unzip -o homelab-artifact.zip -d dist
          ls -lah dist
      - name: Verify exact private tested build and manifest
        run: |
          echo '3a943987c9d30d9ecc231d2f8fd77d855ae18af0fba35b53d1dfae82c57d9f0e  dist/HomeLAB-ResusltsQC-Setup-v1.3.0.exe' | sha256sum -c -
          test "$(stat -c%s dist/HomeLAB-ResusltsQC-Setup-v1.3.0.exe)" = '121509803'
          test -f dist/SHA256SUMS.txt
          test -f dist/latest.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          installer = Path('dist/HomeLAB-ResusltsQC-Setup-v1.3.0.exe')
          manifest = json.loads(Path('dist/latest.json').read_text(encoding='utf-8-sig'))
          digest = hashlib.sha256(installer.read_bytes()).hexdigest()
          assert manifest['version'] == '1.3.0', manifest
          assert manifest['installer_name'] == installer.name, manifest
          assert manifest['sha256'].lower() == digest, (manifest, digest)
          assert int(manifest['size']) == installer.stat().st_size, manifest
          assert manifest['installer_url'] == 'https://github.com/Mehradt2/phoenix-dashboard/releases/download/v1.3.0/HomeLAB-ResusltsQC-Setup-v1.3.0.exe'
          print('Exact artifact and update manifest verified:', digest, installer.stat().st_size)
          PY
      - name: Publish public binary-only update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: HomeLAB Results QC v1.3.0
          prerelease: false
          make_latest: true
          body: |
            Binary-only public update channel for HomeLAB Results QC.
            Source code remains private in the LABQC repository.
            This is the exact v1.3.0 Windows installer from private Stable workflow run 31222245171.
            It passed dependency audit, full regression and de-identified operational golden tests, two-batch 100-item simulation, OCR checks, packaged self-test, silent installed-executable self-test, native Save As/UI protocol checks, and a real public v1.2.3 -> v1.3.0 upgrade E2E using the exact production helper in a Windows install path containing spaces.
            SHA256 and byte size were reverified before this public release.
          files: |
            dist/HomeLAB-ResusltsQC-Setup-v1.3.0.exe
            dist/SHA256SUMS.txt
            dist/latest.json
