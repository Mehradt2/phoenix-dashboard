name: KulePoshti Team Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kuleposhti-operational-web-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare ephemeral CI environment
        shell: bash
        run: |
          echo "DOMAIN=localhost" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=kuleposhti" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=kuleposhti" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=qc-ci@example.org" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/')" >> "$GITHUB_ENV"
          echo "KP_RELEASE=ci-team-probe" >> "$GITHUB_ENV"
          echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
      - name: Frontend and API validation
        run: |
          npm install
          npm run check
          npm test
          npm run build
          cd server
          npm install
          npm test
          node --check src/index.mjs
          node --check src/migrate.mjs
      - name: Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml config >/tmp/kp-compose.yml
      - name: Build and migrate Team stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml build api web migrate
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d db
          docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm migrate
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d api web
      - name: Wait for Team API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs --tail=200
          exit 1
      - name: Verify sampler seed through database
        run: |
          COUNT=$(docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from samplers where active=true")
          test "$COUNT" = "30"
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from information_schema.columns where table_name='cases' and column_name in ('occurred_at','person_meta')" | grep -q '^2$'
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs --tail=250
      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
