name: Publish HomeLabQC v1.2.1 Update Binary

on:
  push:
    paths:
      - '.github/workflows/homelabqc-publish-v1.2.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested private build artifact
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5580-81f4-aa51-793f2b376054/raw?se=2026-08-07T19%3A19%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=39840a12-f7fb-5b0a-8db2-7b54ea00f014&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T06%3A38%3A15Z&ske=2026-08-08T06%3A38%3A15Z&sks=b&skv=2026-02-06&sig=uwaF6vdcqk1BtZBJjDUf2slI05YneBdsKME3/VgxgEI%3D' -o homelab-artifact.zip
          mkdir -p dist
          unzip -o homelab-artifact.zip -d dist
          ls -lah dist
      - name: Verify exact tested installer checksum
        run: |
          echo '5aa0b9dc5663f4d62e7f489b74152eb61f3071ba253590d7367a17bdc41dff32  dist/HomeLAB-ResusltsQC-Setup-v1.2.1.exe' | sha256sum -c -
          test -f dist/SHA256SUMS.txt
      - name: Publish public binary-only update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: HomeLAB Results QC v1.2.1
          prerelease: false
          make_latest: true
          body: |
            Binary-only public update channel for HomeLAB Results QC.
            Source code remains private in the LABQC repository.
            This installer is the exact Windows build that passed the private v1.2.1 release workflow and silent-install self-test.
          files: |
            dist/HomeLAB-ResusltsQC-Setup-v1.2.1.exe
            dist/SHA256SUMS.txt

# publish-trigger: 2026-08-07T19:15Z
