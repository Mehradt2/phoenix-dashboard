name: Publish HomeLAB Results QC v2.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homelabqc-publish-v2.1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact private tested artifact
        shell: pwsh
        run: |
          $url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-6c04-81f4-95df-9ca5c5da808e/raw?se=2026-08-08T01%3A24%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=74f2ef46-03a7-54fe-b172-e204e674abd2&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T04%3A47%3A36Z&ske=2026-08-08T04%3A47%3A36Z&sks=b&skv=2026-02-06&sig=YJ/arztWgeYzCLgz7BVawqcxln3nTwnRNY%2B6vAJG3tQ%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive artifact.zip -DestinationPath release -Force
          Get-ChildItem release -Recurse | Select-Object FullName,Length
      - name: Verify exact stable artifact
        shell: pwsh
        run: |
          $installer='release/dist/HomeLAB-ResusltsQC-Setup-v2.1.0.exe'
          $portable='release/dist/HomeLAB-ResusltsQC.exe'
          if(!(Test-Path $installer)){throw 'installer missing'}
          if(!(Test-Path $portable)){throw 'portable exe missing'}
          if((Get-Item $installer).Length -ne 121590439){throw "installer size mismatch: $((Get-Item $installer).Length)"}
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne 'cf168cf94c2a7997af609fcceb5d9f351b0fcebc073726e336ca6169aaa6b347'){throw 'installer sha mismatch'}
          if((Get-Item $portable).Length -ne 121108036){throw 'portable size mismatch'}
          if((Get-FileHash $portable -Algorithm SHA256).Hash.ToLower() -ne '78221174302921c273d3ad5d1d5aac907bbb38df24f65bffa9068d47f79121fd'){throw 'portable sha mismatch'}
          $manifest=Get-Content 'release/dist/latest.json' -Raw | ConvertFrom-Json
          if($manifest.version -ne '2.1.0' -or $manifest.sha256 -ne 'cf168cf94c2a7997af609fcceb5d9f351b0fcebc073726e336ca6169aaa6b347' -or [int64]$manifest.size -ne 121590439){throw 'latest.json mismatch'}
      - name: Publish public binary-only stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: HomeLAB Results QC v2.1.0
          prerelease: false
          make_latest: true
          body: |
            Public binary/update channel for HomeLAB Results QC v2.1.0.

            v2.1 adds the optional one-click HomeLAB Medical AI Pack and Local AI Gateway for local MedGemma 1.5. The main installer intentionally does not bundle the multi-gigabyte model weights. Model/runtime acquisition starts only after explicit operator acceptance inside the application.

            This release contains the exact Windows artifacts that passed the private stable release workflow on source commit 7acc49e47a6409e6df4123e3d27677bb8daa9ec0.
          files: |
            release/dist/HomeLAB-ResusltsQC-Setup-v2.1.0.exe
            release/dist/HomeLAB-ResusltsQC.exe
            release/dist/SHA256SUMS.txt
            release/dist/latest.json
            release/THIRD_PARTY_MEDICAL_AI_NOTICE.txt
