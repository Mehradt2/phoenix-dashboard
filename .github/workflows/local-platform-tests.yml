name: local-platform-tests
on:
  push:
    paths:
      - "local-platform/**"
  pull_request:
    paths:
      - "local-platform/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-platform/services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
