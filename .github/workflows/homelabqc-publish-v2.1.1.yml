name: Publish HomeLAB Results QC v2.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homelabqc-publish-v2.1.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact private tested artifact
        shell: pwsh
        run: |
          $url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-55ac-81f4-9011-80ebcb2cd306/raw?se=2026-08-08T02%3A30%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=d5770443-5940-5122-ac0e-d30f50259418&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T04%3A49%3A12Z&ske=2026-08-08T04%3A49%3A12Z&sks=b&skv=2026-02-06&sig=sKLLPb%2BRFPsv/OqrkD6x7H9sS7cU5d24KNBhXefvQGI%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive artifact.zip -DestinationPath release -Force
          Get-ChildItem release -Recurse | Select-Object FullName,Length
      - name: Verify exact stable artifact
        shell: pwsh
        run: |
          $installer='release/dist/HomeLAB-ResusltsQC-Setup-v2.1.1.exe'
          $portable='release/dist/HomeLAB-ResusltsQC.exe'
          if(!(Test-Path $installer)){throw 'installer missing'}
          if(!(Test-Path $portable)){throw 'portable exe missing'}
          if((Get-Item $installer).Length -ne 121617330){throw "installer size mismatch: $((Get-Item $installer).Length)"}
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne 'c873681364a7e6606e9729d3f726a02327873e992c5eb0b677d2ec5c4b09b637'){throw 'installer sha mismatch'}
          if((Get-Item $portable).Length -ne 121132228){throw 'portable size mismatch'}
          if((Get-FileHash $portable -Algorithm SHA256).Hash.ToLower() -ne 'bfd122bbb9805bb314e3c7a230b4cb05a44ac879ffcd641fb44adfcf9aa44c63'){throw 'portable sha mismatch'}
          $manifest=Get-Content 'release/dist/latest.json' -Raw | ConvertFrom-Json
          if($manifest.version -ne '2.1.1' -or $manifest.sha256 -ne 'c873681364a7e6606e9729d3f726a02327873e992c5eb0b677d2ec5c4b09b637' -or [int64]$manifest.size -ne 121617330){throw 'latest.json mismatch'}
      - name: Publish public binary-only stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: HomeLAB Results QC v2.1.1
          prerelease: false
          make_latest: true
          body: |
            Public binary/update channel for HomeLAB Results QC v2.1.1.

            v2.1.1 improves difficult Persian scanned reports, column-scrambled PDF text layers and Analyzer/CBC sheets. It adds admission/sample/result/print/analyzer temporal metadata with provenance; print/analyzer timestamps are labelled as proxies when no explicit answer date exists.

            This release contains the exact Windows artifacts that passed the private stable release workflow on source commit 9135ba8949c693d026c306e593d8108be053260f.
          files: |
            release/dist/HomeLAB-ResusltsQC-Setup-v2.1.1.exe
            release/dist/HomeLAB-ResusltsQC.exe
            release/dist/SHA256SUMS.txt
            release/dist/latest.json
            release/THIRD_PARTY_MEDICAL_AI_NOTICE.txt
