name: kuleposhti
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuleposhti}
      POSTGRES_USER: ${POSTGRES_USER:-kuleposhti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-kuleposhti} -d ${POSTGRES_DB:-kuleposhti}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kuleposhti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kuleposhti}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
    command: ["node","src/migrate.mjs"]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-kuleposhti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kuleposhti}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      SESSION_HOURS: ${SESSION_HOURS:-12}
      ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      AUDIO_SPOOL_DIR: /var/lib/kuleposhti/spool
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-40}
    volumes:
      - audio_spool:/var/lib/kuleposhti/spool
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [internal]


  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    command: ["node","src/worker.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kuleposhti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kuleposhti}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
      OGANESON_BASE_URL: ${OGANESON_BASE_URL:?set OGANESON_BASE_URL}
      OGANESON_HEALTH_PATH: ${OGANESON_HEALTH_PATH:-/health}
      OGANESON_TRANSCRIBE_PATH: ${OGANESON_TRANSCRIBE_PATH:-/v1/transcribe}
      OGANESON_FILE_FIELD: ${OGANESON_FILE_FIELD:-file}
      OGANESON_TIMEOUT_MS: ${OGANESON_TIMEOUT_MS:-180000}
      STT_WORKER_POLL_MS: ${STT_WORKER_POLL_MS:-900}
      AUDIO_SPOOL_DIR: /var/lib/kuleposhti/spool
    volumes:
      - audio_spool:/var/lib/kuleposhti/spool
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8080
      KP_RUNTIME_MODE: team
      KP_RELEASE: ${KP_RELEASE:-team-docker}
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  audio_spool:
